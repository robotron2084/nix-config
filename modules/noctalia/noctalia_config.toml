[bar]
displayMode = "auto_hide"
position = "right"

    [bar.widgets]
    center = [ "workspaces" ]
    end = [ "tray", "notifications", "network", "bluetooth", "volume", "battery", "control-center", "session" ]
    position = "right"
    reserve_space = false
    scale = 1.5000000149011612
    show_on_workspace_switch = false
    smart_auto_hide = true
    start = [ "clock", "launcher", "media" ]
    thickness = 50
    widget_spacing = 12

        [[bar.widgets.right]]
        chevronColors = "none"
        colorizeIcons = false
        id = "Tray"

        [[bar.widgets.right]]
        id = "NotificationHistory"
        showUnreadBadge = false

        [[bar.widgets.right]]
        displayMode = "onhover"
        id = "Battery"

        [[bar.widgets.right]]
        displayMode = "onhover"
        iconColor = "none"
        id = "Volume"

        [[bar.widgets.right]]
        displayMode = "onhover"
        id = "Network"

        [[bar.widgets.right]]
        colorizeDistroLogo = false
        colorizeSystemIcon = "none"
        enableColorization = true
        icon = "noctalia"
        id = "ControlCenter"
        useDistroLogo = true

        [[bar.widgets.right]]
        iconColor = "none"
        id = "SessionMenu"

[desktopWidgets]
enabled = true
gridSnap = true
overviewEnabled = true

    [[desktopWidgets.monitorWidgets]]
    name = "HDMI-A-1"

        [[desktopWidgets.monitorWidgets.widgets]]
        clockStyle = "minimal"
        id = "Clock"
        x = 20
        y = 20

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 159.0
    cy = 92.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

[dock]
auto_hide = true
enabled = true
reserve_space = false

[general]
dimmerOpacity = 0.5

[idle]
customCommands = "[]"
enabled = true
fadeDuration = 5
lockCommand = ""
lockTimeout = 660
resumeLockCommand = ""
resumeScreenOffCommand = ""
resumeSuspendCommand = ""
screenOffCommand = ""
screenOffTimeout = 600
suspendCommand = ""
suspendTimeout = 1800

[location]
name = "Tucson"
useFahrenheit = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 213.0
    box_width = 810.0
    cx = 832.0
    cy = 918.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_hint = true
        show_session_buttons = true
        show_weather = true

[notification]
position = "bottom_right"

[notifications]
location = "bottom_right"

[sessionMenu]
countdownDuration = 10000
enableCountdown = true
largeButtonStyle = true
largeButtonsLayout = "single-row"
position = "center"
showHeader = true
showKeybinds = true

    [[sessionMenu.powerOptions]]
    action = "lock"
    enabled = true

    [[sessionMenu.powerOptions]]
    action = "suspend"
    enabled = true

    [[sessionMenu.powerOptions]]
    action = "hibernate"
    enabled = true

    [[sessionMenu.powerOptions]]
    action = "reboot"
    enabled = true

    [[sessionMenu.powerOptions]]
    action = "logout"
    enabled = true

    [[sessionMenu.powerOptions]]
    action = "shutdown"
    enabled = true

    [[sessionMenu.powerOptions]]
    action = "rebootToUefi"
    enabled = false

